    <div id="root" data-route="/about"><div class="site" data-section="about"><a class="skip-link" href="#main">跳到正文</a><header class="header"><div class="name"><a href="/60s" data-discover="true"><span class="dot" aria-hidden="true"></span>Frederick Deng</a></div></header><main id="main" tabindex="-1"><h1>关于我</h1><div class="prose"><p>我是 Frederick，一名数学老师，住在悉尼。</p>
<p>我喜欢把好奇心变成可以分享的东西：把课堂里的概念做成能动手试一试的小程序，把真心喜欢的桌游、地方和体验写成推荐，把常听的歌收进红心歌单，也把一些没有标准答案的问题慢慢写下来——比如什么是爱，人生的意义从哪里来。</p>
