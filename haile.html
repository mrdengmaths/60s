html,body{margin:0;height:100%;background:#0b1410;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:monospace}
#ov{position:fixed;pointer-events:none;z-index:2;image-rendering:pixelated}
#c{image-rendering:pixelated;image-rendering:crisp-edges;display:block;border:4px solid #071821;box-shadow:0 0 0 2px #306850}
#pad{display:none;width:100%;max-width:480px;height:180px;position:relative;margin-top:10px}
body.touch #pad{display:block}
#pad button{position:absolute;background:#306850;color:#e0f8cf;border:3px solid #071821;font:bold 18px monospace;touch-action:none;-webkit-tap-highlight-color:transparent}
#pad button:active{background:#86c06c}
.u,.d,.l,.r{width:54px;height:54px;border-radius:6px}
.u{left:70px;top:8px}.d{left:70px;top:116px}.l{left:16px;top:62px}.r{left:124px;top:62px}
.a,.b{width:66px;height:66px;border-radius:50%}
.a{right:18px;top:30px}.b{right:96px;top:72px}
.st{left:50%;transform:translateX(-50%);bottom:0;width:84px;height:28px;border-radius:14px;font-size:12px!important}
/* phone held sideways: D-pad on the left edge, A/B/Start on the right edge, game fills the middle */
body.touch.land{flex-direction:row}
body.touch.land #pad{position:fixed;inset:0;width:auto;max-width:none;height:auto;margin:0;pointer-events:none}
body.touch.land #pad button{pointer-events:auto}
body.touch.land .u{left:62px;top:calc(50% - 85px)} body.touch.land .d{left:62px;top:calc(50% + 31px)}
body.touch.land .l{left:8px;top:calc(50% - 27px)} body.touch.land .r{left:116px;top:calc(50% - 27px)}
body.touch.land .a{right:14px;left:auto;top:calc(50% - 70px)} body.touch.land .b{right:92px;left:auto;top:calc(50% - 16px)}
body.touch.land .st{left:auto;right:30px;transform:none;bottom:14px}
</style></head>

  disc(ctx, 112, 84, 17, 1); disc(ctx, 112, 84, 15, 0);
  for (const [cx, cy] of [[30, 16], [96, 34]]) { R(ctx, cx, cy, 30, 2, 1); R(ctx, cx + 6, cy - 2, 16, 2, 1); }
  const hill = x => Math.round(86 + Math.sin(x / 26) * 4 + Math.sin(x / 9) * 1.5);
  for (let x = 0; x < W; x++) R(ctx, x, hill(x), 1, H - hill(x), 3);
  if (c.portrait) { drawPortrait(c); return; }
  const mx = Math.round(t * 0.5 - 20), fr = [1, 0, 2, 0][(t >> 3) & 3], dx = mx - 24;   // runs across ONCE (no looping)
  if (dx > W + 4) return;
  const my = hill(mx + 8) - 24, sw = Math.sin(t / 8 * Math.PI / 2) * 1.1, arms = [];   // arms swing back and forth
  const line = (x0, y0, x1, y1) => { const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) | 0;
    for (let i = 0; i <= n; i++) R(ctx, Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), 2, 2, 3); };
  for (const a of [sw, -sw]) {   // each arm is an "L": upper arm hangs from the shoulder, forearm bent 90 degrees forward
    const sx = mx + 7, sy = my + 9, ex = sx + Math.sin(a) * 7, ey = sy + Math.cos(a) * 7;
    arms.push(() => { line(sx, sy, ex, ey); line(ex, ey, ex + Math.cos(a) * 6, ey - Math.sin(a) * 6); }); }
  ctx.drawImage(SPR.fredTall[fr], mx, my);                          // Fred runs in front...
  arms.forEach(d => d());                                           // arms drawn over the body so the L shape shows
  ctx.drawImage(SPR.haile.sil[fr], dx, hill(dx + 8) - 15);        // ...and Haile follows
}
function drawPortrait(c) {
  R(ctx, 0, 0, W, H, 0); const im = IMG.portrait, pw = 60, ph = 90, px = 50, py = 8;
  box(ctx, px - 4, py - 4, pw + 8, ph + 8, 1, 3); R(ctx, px - 2, py - 2, pw + 4, ph + 4, 3);
  if (im) ctx.drawImage(im, px, py);
  text(ctx, 'HAILE', 65, 108, 3);
  if (c.done && (G.t >> 5) & 1) text(ctx, D.pressStart, Math.round((W - textWidth(D.pressStart)) / 2), 126, 2);
}
function drawCut() { const c = G.cut; if (c.name === 'intro') drawIntro(c.t); else if (c.name === 'dream') drawDream(c.t, c); else drawEnd(c.t, c); }

/* ---------- title ---------- */
function drawLang() {
  R(ctx, 0, 0, W, H, 0); box(ctx, 4, 4, 152, 136, 0, 3); R(ctx, 6, 6, 148, 1, 1); R(ctx, 6, 137, 148, 1, 1);
  text(ctx, 'HAILE', Math.round((W - (5 * 18 - 3)) / 2), 16, 3, 3);
  text(ctx, 'Choose language', Math.round((W - textWidth('Choose language')) / 2), 50, 2);
  text(ctx, '选择语言', Math.round((W - textWidth('选择语言')) / 2), 64, 2);
  ['English', '中文'].forEach((o, i) => { const y = 88 + i * 18; box(ctx, 44, y - 4, 72, 16, G.langSel === i ? 1 : 0, 3);
    text(ctx, o, Math.round((W - textWidth(o)) / 2), y, 3); if (G.langSel === i) text(ctx, '>', 50, y, 3); });
  ctx.drawImage(SPR.haile.right[[1, 0, 2, 0][(G.t >> 3) & 3]], 72, 122);
}
function drawTitle() {
  R(ctx, 0, 0, W, H, 0); box(ctx, 4, 4, 152, 136, 0, 3); R(ctx, 6, 6, 148, 1, 1); R(ctx, 6, 137, 148, 1, 1);
  const t1 = D.title;
  text(ctx, t1, Math.round((W - (t1.length * 18 - 3)) / 2), 26, 3, 3);
  pat(ctx, 20, 92, 120, 6, TILES.g); R(ctx, 20, 91, 120, 1, 2);
  ctx.drawImage(SPR.haile.right[[1, 0, 2, 0][(G.t >> 3) & 3]], 72, 76);
  if ((G.t >> 5) & 1) { const s = D.pressStart; text(ctx, s, Math.round((W - textWidth(s)) / 2), 112); }
}
let starting = false;
async function startGame() { if (starting) return; starting = true; initAudio(); sfx.select(); await fadeOut(3); G.day = 1; G.seen = {}; G.flags = {}; G.busy = false; G.puzzle = null; startCut('intro'); starting = false; }
async function toTitle() { if (starting) return; starting = true; stopBG(0.5); await fadeOut(3); musicPaused = false; G.mode = 'title'; G.cut = null; G.day = 1; G.seen = {}; G.flags = {}; G.busy = false; await fadeIn(); starting = false; }

/* =====================================================================
   OPTIONAL: Max's 12-ball balance puzzle (CONFIG.ENABLE_PUZZLE_MINIGAME)
   ===================================================================== */
function runPuzzle() { return new Promise(res => { G.puzzle = { odd: Math.floor(Math.random() * 12), heavy: Math.random() < 0.5, place: Array(12).fill(0),
  cur: 0, left: 3, tilt: 0, phase: 'weigh', msg: 'A: put ball on L / R / off', res }; }); }
function updatePuzzle() {
  const p = G.puzzle; if (hit.B) { G.puzzle = null; p.res(); return; }
  if (p.phase === 'done') { if (hit.A) { G.puzzle = null; p.res(); } return; }
  const n = p.phase === 'weigh' ? 13 : 12;
  if (hit.left) { p.cur = (p.cur + n - 1) % n; sfx.move(); } if (hit.right) { p.cur = (p.cur + 1) % n; sfx.move(); }
  if ((hit.up || hit.down) && p.cur < 12) { p.cur = (p.cur + 6) % 12; sfx.move(); }
  if (!hit.A) return; sfx.select();
  if (p.phase === 'guess') { const ok = p.cur === p.odd, w = p.heavy ? 'heavier' : 'lighter';
    p.msg = ok ? 'Correct! Ball ' + (p.odd + 1) + ' is ' + w : 'Not quite: ball ' + (p.odd + 1) + ' (' + w + ')'; p.phase = 'done'; return; }
  if (p.cur < 12) { p.place[p.cur] = (p.place[p.cur] + 1) % 3; return; }
  const L = [], Rt = []; p.place.forEach((v, i) => v === 1 ? L.push(i) : v === 2 ? Rt.push(i) : 0);
  if (!L.length || L.length !== Rt.length) { p.msg = 'Same number each side!'; return; }
  const s = L.includes(p.odd) ? 1 : Rt.includes(p.odd) ? -1 : 0; p.tilt = p.heavy ? s : -s; p.left--;
  p.msg = p.tilt === 0 ? 'It balances.' : p.tilt > 0 ? 'Left side is heavier.' : 'Right side is heavier.';
  if (!p.left) { p.phase = 'guess'; p.cur = 0; p.msg += ' Pick the odd ball!'; }
}
function drawPuzzle() {
  const p = G.puzzle; R(ctx, 0, 0, W, H, 0); box(ctx, 0, 0, W, H, 0, 3);
  text(ctx, 'Weighings left: ' + p.left, 6, 4);
  for (let i = 0; i < 12; i++) { const x = 8 + (i % 6) * 25, y = 16 + Math.floor(i / 6) * 22, sel = p.cur === i;
    box(ctx, x, y, 20, 12, sel ? 1 : 0, 3); text(ctx, String(i + 1), x + (i < 9 ? 7 : 4), y + 2);
    if (p.place[i]) text(ctx, p.place[i] === 1 ? 'L' : 'R', x + 7, y + 13, 2); }
  const t = p.tilt * 5; R(ctx, 79, 70, 2, 24, 3); R(ctx, 70, 93, 20, 3, 3);
  for (let i = -30; i <= 30; i++) R(ctx, 80 + i, 70 - Math.round(t * i / 30), 1, 2, 3);
  const nL = p.place.filter(v => v === 1).length, nR = p.place.filter(v => v === 2).length;
  for (const [sx, n, dy] of [[50, nL, t], [110, nR, -t]]) { R(ctx, sx, 71 + dy, 1, 8, 3); R(ctx, sx - 10, 79 + dy, 21, 2, 3);
    for (let k = 0; k < n; k++) R(ctx, sx - 9 + (k % 6) * 3, 76 + dy - Math.floor(k / 6) * 3, 2, 2, 2); text(ctx, sx < 80 ? 'L' : 'R', sx - 2, 83 + dy, 2); }
  if (p.phase === 'weigh') { box(ctx, 112, 96, 42, 12, p.cur === 12 ? 1 : 0, 3); text(ctx, 'WEIGH', 118, 98); }
  wrap(p.msg, 25).forEach((l, i) => text(ctx, l, 6, 112 + i * 10));
}

/* =====================================================================
   MAIN LOOP, LOADING, SCREEN SIZE, TOUCH BUTTONS
   ===================================================================== */
function step() {
  G.t++;
  if (hit.debug) debug = !debug;
  if (hit.mute) muted = !muted;
  if (G.mode === 'lang') {   // first screen: choose English or Chinese
    if (hit.up || hit.down) { G.langSel ^= 1; sfx.move(); }
    if ((hit.A || hit.start) && !G.fade) { initAudio(); sfx.select(); LANG = G.langSel ? 'zh' : 'en'; D = DIALOGUE = DIALOGUES[LANG]; G.mode = 'title'; }
  }
  else if (G.mode === 'title') { if ((hit.start || hit.A) && !G.fade) startGame(); else if (hit.B) G.mode = 'lang'; }
  else if (G.mode === 'map') { if (G.puzzle) updatePuzzle(); else if (ui) updateUI(); updateMap(); }
  else if (G.mode === 'cut') { G.cut.t++; if (ui) updateUI(); else if (G.cut.done && (hit.start || hit.A)) toTitle(); }
  for (const k in hit) delete hit[k];
  frameWaiters.splice(0).forEach(r => r());
}
function render() {
  if (G.mode === 'lang') drawLang(); else if (G.mode === 'title') drawTitle(); else if (G.mode === 'map') { drawMap(); if (G.puzzle) drawPuzzle(); } else if (G.mode === 'cut') drawCut();
  drawUI(); applyFade(); drawOverlay();
}
const ov = document.getElementById('ov'), octx = ov.getContext('2d');
/* Chinese characters stay PIXELATED: each one is a 24x24 grid of square pixels (twice the detail of the
   game's own pixels), made by drawing the character large and averaging it down, so strokes stay clear. */
const CJK2 = {}, CJK_N = 24;
function cjkPixels(ch) {
  if (CJK2[ch]) return CJK2[ch];
  const big = 192, c = mkCanvas(big, big), g = c.getContext('2d');
  g.font = '500 ' + (big * 0.92) + 'px "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",sans-serif';
  g.textBaseline = 'middle'; g.textAlign = 'center'; g.fillStyle = '#000'; g.fillText(ch, big / 2, big / 2 + big * 0.04);
  const d = g.getImageData(0, 0, big, big).data, cell = big / CJK_N, on = [];
  for (let y = 0; y < CJK_N; y++) for (let x = 0; x < CJK_N; x++) { let sum = 0;
    for (let j = 0; j < cell; j++) for (let i = 0; i < cell; i++) sum += d[((y * cell + j) * big + x * cell + i) * 4 + 3];
    if (sum / (cell * cell * 255) > 0.3) on.push(y * CJK_N + x); }
  return (CJK2[ch] = on);
}
function drawOverlay() {
  octx.clearRect(0, 0, ov.width, ov.height);
  ov.style.opacity = G.fade ? String(Math.max(0, 1 - G.fade / 2)) : '1';   // fades together with the screen
  for (const [ch, x, y, c, sc] of OVQ) {
    const p = OVS * sc / 2;   // size of one character pixel on the overlay
    octx.fillStyle = PAL[c];
    for (const i of cjkPixels(ch)) octx.fillRect(Math.round(x * OVS + (i % CJK_N) * p), Math.round(y * OVS + Math.floor(i / CJK_N) * p), Math.ceil(p), Math.ceil(p)); }
  OVQ.length = 0;
}
function placeOverlay() {   // keep the sharp text layer exactly over the game screen (inside its 4px border)
  const r = cv.getBoundingClientRect();
  Object.assign(ov.style, { left: (r.left + 4) + 'px', top: (r.top + 4) + 'px', width: (r.width - 8) + 'px', height: (r.height - 8) + 'px' });
}
let lastT = 0, acc = 0;
function loop(now) { if (!lastT) lastT = now; acc += Math.min(100, now - lastT); lastT = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; } render(); requestAnimationFrame(loop); }

function placeholder(name, w, h) { const c = mkCanvas(w, h), g = c.getContext('2d'); pat(g, 0, 0, w, h, ['00110011', '00110011', '11001100', '11001100', '00110011', '00110011', '11001100', '11001100']);
  text(g, 'MISSING', 4, 4); text(g, name, 4, 14); return c; }
function loadImages() {
  return Promise.all(Object.entries(IMAGES).map(([k, src]) => new Promise(res => {
    const sc = Object.values(SCENES).find(s => s.image === k); const im = new Image();
    im.onload = () => { IMG[k] = im; res(); }; im.onerror = () => { IMG[k] = placeholder(k + '.png', sc.w * 8, sc.h * 8); res(); };
    if (src.startsWith('%%')) src = k + '.png'; im.src = src; })));
}
function resize() {
  const touch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
  const land = touch && innerWidth > innerHeight;
  document.body.classList.toggle('touch', touch); document.body.classList.toggle('land', land);
  const s = land ? Math.max(1, Math.min((innerWidth - 2 * 185) / W, (innerHeight - 10) / H))      // landscape: use all the space between the controls
                 : Math.max(1, Math.floor(Math.min(innerWidth / W, (innerHeight - (touch ? 200 : 16)) / H)));
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  requestAnimationFrame(placeOverlay);
}
document.querySelectorAll('[data-k]').forEach(b => { const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture?.(e.pointerId); press(k); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(ev, e => { e.preventDefault(); release(k); });
  b.addEventListener('contextmenu', e => e.preventDefault()); });
addEventListener('resize', resize); addEventListener('orientationchange', () => setTimeout(resize, 200));
(async function boot() {
  resize(); buildSprites(); IMG.yard = drawYard(); IMG.street = drawStreet(); await loadImages();
  await new Promise(r => { const im = new Image(); im.onload = () => { IMG.portrait = im; r(); }; im.onerror = r; im.src = PORTRAIT; });
  requestAnimationFrame(loop);
})();

</script>
